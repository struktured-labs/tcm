name: Build Android APK

on:
  push:
    branches: [ claude/tcm-health-landing-vd2N2, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: |
        cd android-app
        chmod +x gradlew || gradle wrapper

    - name: Build Debug APK
      run: |
        cd android-app
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tcm-health-app
        path: android-app/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: TCM Health App v1.0.${{ github.run_number }}
        body: |
          ## TCM Health Android App

          **Download and Install:**
          1. Download `app-debug.apk` below
          2. Transfer to your Android phone
          3. Enable "Install from Unknown Sources" in Settings
          4. Tap the APK to install

          **Features:**
          - Constitution Assessment Quiz
          - Personalized TCM Recommendations
          - Food Database with TCM Properties
          - Herbal Remedy Guide
          - Acupressure Point Library

          Built with Jetpack Compose ❤️
        files: android-app/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
